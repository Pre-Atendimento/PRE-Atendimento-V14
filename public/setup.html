<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup Inicial — Pré-Atendimento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo img { height: 56px; }
    h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 0.25rem; }
    p.sub { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .notice {
      background: #fef9c3;
      border: 1px solid #fde047;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #713f12;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input {
      width: 100%; padding: 0.7rem 1rem;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-size: 0.95rem; outline: none; margin-bottom: 1rem;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #22c55e; }
    button {
      width: 100%; padding: 0.85rem;
      background: #22c55e; color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #16a34a; }
    button:disabled { background: #86efac; cursor: not-allowed; }
    .msg {
      margin-top: 1rem; padding: 0.75rem 1rem;
      border-radius: 8px; font-size: 0.9rem; text-align: center;
      display: none;
    }
    .msg.success { background: #dcfce7; color: #166534; display: block; }
    .msg.error   { background: #fee2e2; color: #991b1b; display: block; }
    .login-link { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: #64748b; }
    .login-link a { color: #22c55e; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/logo-pre-atendimento.png" alt="Pré-Atendimento" onerror="this.style.display='none'">
    </div>
    <h1>Criar conta Admin</h1>
    <p class="sub">Configure o primeiro acesso ao sistema.</p>

    <div class="notice">
      ⚠️ Este endpoint só funciona enquanto não houver nenhum usuário cadastrado.
    </div>

    <form id="form">
      <label>Nome completo</label>
      <input type="text" id="name" placeholder="Seu nome" required>

      <label>E-mail</label>
      <input type="email" id="email" placeholder="admin@exemplo.com" required>

      <label>Senha</label>
      <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">

      <button type="submit" id="btn">Criar Admin</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="login-link">
      Já tem conta? <a href="/">Entrar</a>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = 'Criando…';
      msg.className = 'msg';
      msg.style.display = 'none';

      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          msg.className = 'msg success';
          msg.textContent = '✅ Admin criado! Redirecionando para o login…';
          setTimeout(() => window.location.href = '/', 2000);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Erro desconhecido.';
          btn.disabled = false;
          btn.textContent = 'Criar Admin';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Erro de conexão. Tente novamente.';
        btn.disabled = false;
        btn.textContent = 'Criar Admin';
      }
    });
  </script>
</body>
</html>
